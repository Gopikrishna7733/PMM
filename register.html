<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pharmaceutics Mastery Matrix (PMM) - Create Scholar Account" />
  <title>Create Account — Pharmaceutics Mastery Matrix (PMM)</title>
  
  <link rel="stylesheet" href="./css/pmm-system.css" />
  <link rel="stylesheet" href="./css/pmm-auth.css" />
</head>
<body class="pmm-auth-page">

  <!-- Minimal Auth Top Header -->
  <header class="pmm-auth-header">
    <a href="index.html" class="pmm-brand-lockup" aria-label="Return to PMM Home">
      <div class="pmm-brand-logo" aria-hidden="true"><span>PMM</span></div>
      <div class="pmm-brand-text">
        <span class="pmm-brand-title">Pharmaceutics Mastery Matrix</span>
        <span class="pmm-brand-subtitle">Learn. Practice. Master.</span>
      </div>
    </a>

    <button type="button" class="pmm-btn pmm-btn--icon pmm-btn--ghost" data-pmm-theme-toggle aria-label="Toggle dark/light visual mode">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </header>

  <!-- Auth Main Center -->
  <main class="pmm-auth-main">
    <div class="pmm-auth-card" style="max-width: 520px;">
      <div class="pmm-auth-card-header">
        <span class="pmm-badge pmm-badge--accent pmm-badge--pill">Scholar Enrollment</span>
        <h1 class="pmm-auth-title">Create Your PMM Account</h1>
        <p class="pmm-auth-subtitle">Begin intelligent, quiz-based pharmaceutical science mastery</p>
      </div>

      <!-- Error / Status Alert Box -->
      <div id="auth-alert" class="pmm-auth-alert" role="alert" aria-live="polite"></div>

      <!-- Registration Form -->
      <form id="register-form" class="pmm-auth-form" novalidate>
        <!-- Full Name -->
        <div class="pmm-input-group">
          <label for="reg-name" class="pmm-input-label">Full Name & Credentials</label>
          <div class="pmm-input-wrap pmm-input-wrap--icon-left">
            <span class="pmm-input__icon-left" aria-hidden="true">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input 
              type="text" 
              id="reg-name" 
              name="fullName" 
              class="pmm-input" 
              placeholder="e.g. Alex Rivera, BPharm / PharmD" 
              required 
            />
          </div>
        </div>

        <!-- Academic Email Field -->
        <div class="pmm-input-group">
          <label for="reg-email" class="pmm-input-label">Academic Email Address</label>
          <div class="pmm-input-wrap pmm-input-wrap--icon-left">
            <span class="pmm-input__icon-left" aria-hidden="true">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input 
              type="email" 
              id="reg-email" 
              name="email" 
              class="pmm-input" 
              placeholder="e.g. a.rivera@pharmacy.edu" 
              autocomplete="email" 
              required 
            />
          </div>
        </div>

        <!-- University / Institution -->
        <div class="pmm-input-group">
          <label for="reg-institution" class="pmm-input-label">University / Institution</label>
          <div class="pmm-input-wrap pmm-input-wrap--icon-left">
            <span class="pmm-input__icon-left" aria-hidden="true">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 21h18M3 10h18M5 10v11M19 10v11M12 2l10 5H2l10-5z"/></svg>
            </span>
            <input 
              type="text" 
              id="reg-institution" 
              name="institution" 
              class="pmm-input" 
              placeholder="e.g. Faculty of Pharmacy & Pharmaceutical Sciences" 
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="pmm-input-group">
          <label for="reg-password" class="pmm-input-label">Create Password (Min. 8 characters)</label>
          <div class="pmm-input-wrap pmm-input-wrap--icon-left">
            <span class="pmm-input__icon-left" aria-hidden="true">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input 
              type="password" 
              id="reg-password" 
              name="password" 
              class="pmm-input" 
              placeholder="••••••••••••" 
              autocomplete="new-password" 
              required 
            />
            <button type="button" class="pmm-password-toggle" id="btn-toggle-password" aria-label="Toggle password visibility">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <!-- Dynamic Password Strength Bar -->
          <div class="pmm-password-strength-bar" aria-hidden="true">
            <div class="pmm-strength-segment" id="strength-1"></div>
            <div class="pmm-strength-segment" id="strength-2"></div>
            <div class="pmm-strength-segment" id="strength-3"></div>
          </div>
          <span class="pmm-input-helper" id="strength-label">Password security level</span>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="pmm-btn pmm-btn--accent pmm-btn--lg" id="btn-submit" style="width: 100%; margin-top: var(--pmm-space-3);">
          <span>Create Account & Enter Matrix</span>
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <div class="pmm-auth-card-footer">
        <span>Already have an academic account? </span>
        <a href="login.html">Sign In Here</a>
      </div>
    </div>
  </main>

  <!-- Service Modules & Guard -->
  <script src="./js/pmm-components.js"></script>
  <script src="./js/services/mock-auth-adapter.js"></script>
  <script src="./js/services/auth-service.js"></script>
  <script src="./js/utils/guard.js"></script>
  <script src="./js/utils/validation.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Guard: If already authenticated, redirect to dashboard
      await PMM_Guard.requireGuest({ redirectTo: 'dashboard.html' });

      const form = document.getElementById('register-form');
      const nameInput = document.getElementById('reg-name');
      const emailInput = document.getElementById('reg-email');
      const institutionInput = document.getElementById('reg-institution');
      const passwordInput = document.getElementById('reg-password');
      const submitBtn = document.getElementById('btn-submit');
      const alertBox = document.getElementById('auth-alert');
      const togglePasswordBtn = document.getElementById('btn-toggle-password');
      const strengthSegments = [
        document.getElementById('strength-1'),
        document.getElementById('strength-2'),
        document.getElementById('strength-3')
      ];
      const strengthLabel = document.getElementById('strength-label');

      // Password visibility toggle
      if (togglePasswordBtn) {
        togglePasswordBtn.addEventListener('click', () => {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
        });
      }

      // Real-time password strength check
      passwordInput.addEventListener('input', () => {
        const val = passwordInput.value;
        const res = PMM_Validation.evaluatePasswordStrength(val);

        strengthSegments.forEach((seg, idx) => {
          seg.className = 'pmm-strength-segment';
          if (idx < res.score) {
            seg.classList.add(`is-active-${res.color}`);
          }
        });

        strengthLabel.textContent = `Strength: ${res.label}`;
      });

      function showAlert(message, type = 'error') {
        alertBox.textContent = message;
        alertBox.className = `pmm-auth-alert pmm-auth-alert--${type}`;
        alertBox.style.display = 'flex';
      }

      function clearAlert() {
        alertBox.style.display = 'none';
        alertBox.textContent = '';
      }

      // Registration Form Submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearAlert();

        const fullName = nameInput.value.trim();
        const email = emailInput.value.trim();
        const institution = institutionInput.value.trim() || 'Independent Pharmacy Scholar';
        const password = passwordInput.value;

        if (!fullName) {
          showAlert('Please provide your full name.');
          nameInput.focus();
          return;
        }

        if (!PMM_Validation.isValidEmail(email)) {
          showAlert('Please provide a valid academic email address.');
          emailInput.focus();
          return;
        }

        if (!PMM_Validation.isValidPassword(password)) {
          showAlert('Password must be at least 8 characters long.');
          passwordInput.focus();
          return;
        }

        // Set Loading State
        submitBtn.classList.add('pmm-btn--loading');
        submitBtn.disabled = true;

        try {
          const { data, error } = await PMM_AuthService.signUp({
            email,
            password,
            fullName,
            institution
          });

          if (error) {
            showAlert(error.message);
            submitBtn.classList.remove('pmm-btn--loading');
            submitBtn.disabled = false;
            return;
          }

          // Registration Successful
          showAlert('Account initialized successfully. Provisioning your mastery matrix...', 'success');

          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 400);

        } catch (err) {
          showAlert('An unexpected system error occurred. Please try again.');
          submitBtn.classList.remove('pmm-btn--loading');
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
