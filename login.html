<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pharmaceutics Mastery Matrix (PMM) - Scholar Portal Login" />
  <title>Scholar Login — Pharmaceutics Mastery Matrix (PMM)</title>
  
  <link rel="stylesheet" href="./css/pmm-system.css" />
  <link rel="stylesheet" href="./css/pmm-auth.css" />
</head>
<body class="pmm-auth-page">

  <!-- Minimal Auth Top Header -->
  <header class="pmm-auth-header">
    <a href="index.html" class="pmm-brand-lockup" aria-label="Return to PMM Home">
      <div class="pmm-brand-logo" aria-hidden="true"><span>PMM</span></div>
      <div class="pmm-brand-text">
        <span class="pmm-brand-title">Pharmaceutics Mastery Matrix</span>
        <span class="pmm-brand-subtitle">Learn. Practice. Master.</span>
      </div>
    </a>

    <button type="button" class="pmm-btn pmm-btn--icon pmm-btn--ghost" data-pmm-theme-toggle aria-label="Toggle dark/light visual mode">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
  </header>

  <!-- Auth Main Center -->
  <main class="pmm-auth-main">
    <div class="pmm-auth-card">
      <div class="pmm-auth-card-header">
        <span class="pmm-badge pmm-badge--accent pmm-badge--pill">Scholar Gateway</span>
        <h1 class="pmm-auth-title">Scholar Portal Sign In</h1>
        <p class="pmm-auth-subtitle">Access your personalized pharmacy curriculum and telemetry</p>
      </div>

      <!-- Demo Account Quick-Fill Card -->
      <div class="pmm-demo-credentials-box">
        <div class="pmm-demo-info">
          <span>Demo Account: <strong>scholar@pmm.edu</strong></span>
          <span style="color: var(--pmm-text-muted);">Pass: <strong>Mastery2026!</strong> (Fellow Tier)</span>
        </div>
        <button type="button" class="pmm-demo-fill-btn" id="btn-fill-demo">Auto-Fill</button>
      </div>

      <!-- Error / Status Alert Box -->
      <div id="auth-alert" class="pmm-auth-alert" role="alert" aria-live="polite"></div>

      <!-- Login Form -->
      <form id="login-form" class="pmm-auth-form" novalidate>
        <!-- Email Field -->
        <div class="pmm-input-group">
          <label for="login-email" class="pmm-input-label">Academic Email Address</label>
          <div class="pmm-input-wrap pmm-input-wrap--icon-left">
            <span class="pmm-input__icon-left" aria-hidden="true">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </span>
            <input 
              type="email" 
              id="login-email" 
              name="email" 
              class="pmm-input" 
              placeholder="e.g. scholar@pmm.edu" 
              autocomplete="email" 
              required 
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="pmm-input-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label for="login-password" class="pmm-input-label">Password</label>
            <a href="#" style="font-size: 11px; color: var(--pmm-accent); text-decoration: none;" onclick="alert('Demo environment: Please use the Auto-Fill button above to use the seed account, or create a new account.'); return false;">Forgot?</a>
          </div>
          <div class="pmm-input-wrap pmm-input-wrap--icon-left">
            <span class="pmm-input__icon-left" aria-hidden="true">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input 
              type="password" 
              id="login-password" 
              name="password" 
              class="pmm-input" 
              placeholder="••••••••••••" 
              autocomplete="current-password" 
              required 
            />
            <button type="button" class="pmm-password-toggle" id="btn-toggle-password" aria-label="Toggle password visibility">
              <svg id="eye-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="pmm-btn pmm-btn--primary pmm-btn--lg" id="btn-submit" style="width: 100%; margin-top: var(--pmm-space-2);">
          <span>Sign In to Matrix</span>
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </form>

      <div class="pmm-auth-card-footer">
        <span>Don't have an academic account? </span>
        <a href="register.html">Create PMM Account</a>
      </div>
    </div>
  </main>

  <!-- Service Modules & Guard -->
  <script src="./js/pmm-components.js"></script>
  <script src="./js/services/mock-auth-adapter.js"></script>
  <script src="./js/services/auth-service.js"></script>
  <script src="./js/utils/guard.js"></script>
  <script src="./js/utils/validation.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Guard: If already authenticated, redirect to dashboard
      await PMM_Guard.requireGuest({ redirectTo: 'dashboard.html' });

      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('login-email');
      const passwordInput = document.getElementById('login-password');
      const submitBtn = document.getElementById('btn-submit');
      const alertBox = document.getElementById('auth-alert');
      const fillDemoBtn = document.getElementById('btn-fill-demo');
      const togglePasswordBtn = document.getElementById('btn-toggle-password');

      // Autofill demo helper
      if (fillDemoBtn) {
        fillDemoBtn.addEventListener('click', () => {
          emailInput.value = 'scholar@pmm.edu';
          passwordInput.value = 'Mastery2026!';
          emailInput.focus();
        });
      }

      // Password visibility toggle
      if (togglePasswordBtn) {
        togglePasswordBtn.addEventListener('click', () => {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
        });
      }

      function showAlert(message, type = 'error') {
        alertBox.textContent = message;
        alertBox.className = `pmm-auth-alert pmm-auth-alert--${type}`;
        alertBox.style.display = 'flex';
      }

      function clearAlert() {
        alertBox.style.display = 'none';
        alertBox.textContent = '';
      }

      // Form Submission
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearAlert();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!PMM_Validation.isValidEmail(email)) {
          showAlert('Please provide a valid academic email address.');
          emailInput.focus();
          return;
        }

        if (!password) {
          showAlert('Please enter your password.');
          passwordInput.focus();
          return;
        }

        // Set Loading State
        submitBtn.classList.add('pmm-btn--loading');
        submitBtn.disabled = true;

        try {
          const { data, error } = await PMM_AuthService.signIn({ email, password });

          if (error) {
            showAlert(error.message);
            submitBtn.classList.remove('pmm-btn--loading');
            submitBtn.disabled = false;
            return;
          }

          // Successful Sign-In
          showAlert('Credentials verified. Redirecting to your Mastery Dashboard...', 'success');
          
          setTimeout(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const destination = urlParams.get('redirect') || 'dashboard.html';
            window.location.href = destination;
          }, 400);

        } catch (err) {
          showAlert('An unexpected system error occurred. Please try again.');
          submitBtn.classList.remove('pmm-btn--loading');
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
